manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # 名前を 'urob-pmw3610' に変更し、過去の履歴を断ち切る
    - name: urob-pmw3610
      remote: urob
      repo: zmk-pmw3610-driver
      revision: main
      path: drivers/pmw3610-new
  self:
    path: config