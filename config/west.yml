manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: urob
      revision: main
      path: drivers/pmw3610-new  # ← ここを追記。インストール先を変えて衝突を回避！
  self:
    path: config