manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob-remote # 名前を全く新しいものにする
      url-base: https://github.com/urob
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-pmw3610-driver-new # プロジェクト名に -new を付けて別物にする
      remote: urob-remote
      revision: main
  self:
    path: config