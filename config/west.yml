manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import:
        path: app/west.yml
        # ↓ ここが重要：他で定義されている pmw3610 ドライバを無視させる
        name-allowlist:
          - zmk-pmw3610-driver
    - name: zmk-pmw3610-driver
      remote: urob
      revision: main
  self:
    path: config