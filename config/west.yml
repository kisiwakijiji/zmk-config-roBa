manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: true # 'app/west.yml' を自動的に探しに行く最も安全な設定
    - name: zmk-pmw3610-driver
      remote: urob
      revision: main
  self:
    path: config