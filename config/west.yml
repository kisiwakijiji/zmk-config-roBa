manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob-repo # 名前を新しくする
      url-base: https://github.com/urob
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-pmw3610-driver-urob # プロジェクト名を変更して衝突を回避
      remote: urob-repo
      revision: main
      path: modules/zmk-pmw3610-driver # インストール先パスを指定
  self:
    path: config