manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: zmk-pmw3610-driver-repo # リモート名を新しくして衝突を避ける
      url-base: https://github.com/urob
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: zmk-pmw3610-driver-repo # 新しいリモート名を指定
      revision: main
  self:
    path: config